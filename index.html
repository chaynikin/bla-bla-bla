<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chaynikin Links</title>
  <meta name="description" content="Chaynikin: TikTok, Instagram, GitHub, VK, Telegram and email." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>" />
  <link rel="preload" href="fonts/playfair-display-latin-600-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css?v=11" />
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <main>
    <header class="intro">
      <h1><span class="title-text">Chaynikin Links</span></h1>
    </header>

    <section class="stage" id="stage" aria-label="My links">
      <!-- before the bar so the 3D bar paints over them -->
      <div class="glow" aria-hidden="true"></div>
      <div class="shadow" aria-hidden="true"></div>
      <div class="scaler">
        <!-- the six tiles (one link each), crack lines and crumbs are added by script.js -->
        <nav class="bar" id="bar" aria-label="Social media and email">
        </nav>
      </div>
    </section>
  </main>

  <dialog class="email-dialog" id="emailDialog" aria-labelledby="emailTitle">
    <form id="emailForm" method="dialog">
      <h2 id="emailTitle">Write to me</h2>
      <label>
        Subject
        <input name="subject" type="text" maxlength="120" placeholder="Hello!" />
      </label>
      <label>
        Message
        <textarea name="body" rows="5" placeholder="Your message…"></textarea>
      </label>
      <p class="address">or write directly to <a id="emailAddress" href="#"></a></p>
      <div class="actions">
        <button type="button" class="ghost" id="emailCancel">Cancel</button>
        <button type="submit" class="primary">Open mail app</button>
      </div>
    </form>
  </dialog>

  <script src="icons.js?v=11"></script>
  <script src="script.js?v=11"></script>
  <!-- separate module: if WebGL or the module fails, the links still work -->
  <script type="module" src="background.js?v=11"></script>
</body>
</html>
