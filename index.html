<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chocolate</title>
  <meta name="description" content="A rotatable chocolate bar and my links." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header class="intro">
      <h1>Sweet Links</h1>
      <p class="hint">Drag, swipe or use the arrow keys to turn the bar</p>
    </header>

    <section
      class="stage"
      id="stage"
      tabindex="0"
      role="img"
      aria-label="A 3D chocolate bar. Drag or use the arrow keys to rotate it."
    >
      <!-- before the bar so the 3D bar paints over it -->
      <div class="shadow" aria-hidden="true"></div>
      <div class="scaler">
        <div class="bar" id="bar">
          <div class="face front">
            <!-- 3 × 6 grid of chocolate pieces, filled by script.js -->
            <div class="pieces" id="pieces"></div>
          </div>
          <div class="face back">
            <div class="foil"></div>
            <div class="wrapper">
              <span class="brand">Cacao</span>
              <span class="sub">dark chocolate · 72%</span>
              <span class="weight">100 g</span>
            </div>
          </div>
          <div class="face side right"></div>
          <div class="face side left"></div>
          <div class="face end top"></div>
          <div class="face end bottom"></div>
        </div>
      </div>
    </section>

    <nav class="links" id="links" aria-label="Social media"></nav>

    <button class="email-btn" id="emailBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.3V17h16V7.3l-8 5.6-8-5.6zM5.4 7 12 11.6 18.6 7H5.4z"/></svg>
      Send me an email
    </button>
  </main>

  <dialog class="email-dialog" id="emailDialog" aria-labelledby="emailTitle">
    <form id="emailForm" method="dialog">
      <h2 id="emailTitle">Write to me</h2>
      <label>
        Subject
        <input name="subject" type="text" maxlength="120" placeholder="Hello!" />
      </label>
      <label>
        Message
        <textarea name="body" rows="5" placeholder="Your message…"></textarea>
      </label>
      <p class="address">or write directly to <a id="emailAddress" href="#"></a></p>
      <div class="actions">
        <button type="button" class="ghost" id="emailCancel">Cancel</button>
        <button type="submit" class="primary">Open mail app</button>
      </div>
    </form>
  </dialog>

  <script src="icons.js"></script>
  <script src="script.js"></script>
</body>
</html>
