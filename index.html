<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chocolate</title>
  <meta name="description" content="A rotatable chocolate bar and my links." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header class="intro">
      <h1>Sweet Links</h1>
      <p class="hint">Drag to turn the bar · tap a piece to open a link</p>
    </header>

    <section
      class="stage"
      id="stage"
      tabindex="0"
      role="group"
      aria-label="Chocolate bar with my links. Drag or use the arrow keys to rotate it."
    >
      <!-- before the bar so the 3D bar paints over them -->
      <div class="glow" aria-hidden="true"></div>
      <div class="shadow" aria-hidden="true"></div>
      <div class="scaler">
        <div class="bar" id="bar">
          <div class="face front">
            <!-- 3 × 6 grid of pieces; the middle rows hold the links (script.js) -->
            <nav class="pieces" id="pieces" aria-label="Social media and email"></nav>
          </div>
          <div class="face back">
            <div class="foil"></div>
            <div class="wrapper">
              <span class="brand">Cacao</span>
              <span class="sub">dark chocolate · 72%</span>
              <span class="weight">100 g</span>
            </div>
          </div>
          <div class="face side right"></div>
          <div class="face side left"></div>
          <div class="face end top"></div>
          <div class="face end bottom"></div>
        </div>
      </div>
    </section>
  </main>

  <dialog class="email-dialog" id="emailDialog" aria-labelledby="emailTitle">
    <form id="emailForm" method="dialog">
      <h2 id="emailTitle">Write to me</h2>
      <label>
        Subject
        <input name="subject" type="text" maxlength="120" placeholder="Hello!" />
      </label>
      <label>
        Message
        <textarea name="body" rows="5" placeholder="Your message…"></textarea>
      </label>
      <p class="address">or write directly to <a id="emailAddress" href="#"></a></p>
      <div class="actions">
        <button type="button" class="ghost" id="emailCancel">Cancel</button>
        <button type="submit" class="primary">Open mail app</button>
      </div>
    </form>
  </dialog>

  <script src="icons.js"></script>
  <script src="script.js"></script>
</body>
</html>
